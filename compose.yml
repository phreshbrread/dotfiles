---
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000 # Match drive UID
      - PGID=100  # Match drive GID
      - TZ=Australia/Melbourne
      - JELLYFIN_PublishedServerUrl=https://screamingbird.duckdns.org
    group_add:
      - '303' # Add user to "render" group to enable GPU accel
      - '100'
    volumes:
      - /Jellyfin:/config:rwx
      - /external-drive/Media:/data/media:rwx
    ports:
      - 8096:8096
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    restart: unless-stopped

