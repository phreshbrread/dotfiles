---
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000 # Match drive UID
      - PGID=100  # Match drive GID
      - TZ=Australia/Melbourne
      - JELLYFIN_PublishedServerUrl=https://screamingbird.duckdns.org
    group_add:
      - '303' # Add user to "render" group to enable GPU accel
      - '100'
    volumes:
      - ./jellyfin:/config:rwx
      - ./media/Media:/data/media:rwx
    ports:
      - 8096:8096
    devices:
      - /dev/dri:/dev/dri
      #- /dev/kfd:/dev/kfd
    restart: unless-stopped

  mc-server:
    image: itzg/minecraft-server:latest
    container_name: minecraft-vanilla
    ports:
      - "25566:25565"
    environment:
      PUID: 1000
      PGID: 100
      EULA: "TRUE"
      MEMORY: "12G"
      #TYPE: "VANILLA"
      MODPACK_PLATFORM: "AUTO_CURSEFORGE"
      CF_MODPACK_ZIP: "/data/conticraft.zip"
      #CF_API_KEY: ${CF_API_KEY}
      CF_SLUG: "custom-pack"
      VERSION: "1.21.1"
      DIFFICULTY: "hard"
      ALLOW_FLIGHT: true
      ICON: "https://soybooru.com/api/booru/posts/1025/file"
      LEVEL: "RealPingaCraft"
      MOTD: "Nuke the world,\nNuke the universe."
      SYNC_CHUNK_WRITES: true
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: "Phrench64,LeggOfHam,Spineussy,Crepeinator,MonkeeMannz,LockiBocki1,tomas8s,OhSprenos"
      WHITELIST_FILE_RESOLVER: "NONE"
    volumes:
      - ./servers/minecraft/:/data
    stdin_open: true
    tty: true
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8090:8090" # qBittorrent WebUI
    volumes:
      - ./gluetun:/gluetun
      - ./gluetun/wireguard/wg0.conf:/gluetun/wireguard/wg0.conf:ro
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Australia/Melbourne
      - WEBUI_PORT=8090
    volumes:
      - ./qbittorrent:/config
      - ./torrents:/downloads
    restart: unless-stopped
